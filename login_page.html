<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Page</title>
    <link rel="stylesheet" href="./login_page.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Unbounded:wght@200..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="left-panel">
        <img src="./images/signup left image .jpeg" alt="image">
    </div>
    <div class="right-panel">
        <div class="close-btn">
            <a href="index.html"><button>&times;</button></a>
        </div>
        <div class="tabs">
            <a href="signup_page.html">
                <div class="Signin tab">Sign up</div>
            </a>
            <a href="login_page.html">
                <div class="Login">Log in</div>
            </a>
        </div>
        <div class="social-container">
            <button class="google-btn">
                <img src="./images/New-Google-Logo.jpg" alt="Google" width="20">
                Continue with Google
            </button>
            <button class="fb-btn">
                <i class="fab fa-facebook"></i>
            </button>
        </div>
        <div class="separator">or email</div>
        <div class="input-group">
            <label>Email</label>
            <input type="email" placeholder="user@email.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" placeholder="........">
                <i class="far fa-eye toggle-password"></i>
            </div>
        </div>
        <button type="submit" class="submit-btn">Log in</button>
        <a href="./signup_page.html"><button type="submit" class="newAccountButton">New to Curio? Create an account</button></a>
</body>
</html>
